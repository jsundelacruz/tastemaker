<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TasteMaker · Find similar</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,400&family=DM+Serif+Display&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0f0f0e;
      --surface: #1a1a18;
      --border: #2a2a26;
      --text: #e8e6e3;
      --muted: #8a8784;
      --accent: #c4a574;
      --accent-dim: #8b7355;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'DM Sans', system-ui, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; line-height: 1.5; }
    .container { max-width: 720px; margin: 0 auto; padding: 3rem 1.5rem; }
    h1 { font-family: 'DM Serif Display', serif; font-size: 1.75rem; font-weight: 400; color: var(--accent); margin-bottom: 1.5rem; }
    .tabs { display: flex; gap: 0; margin-bottom: 1.5rem; border-bottom: 1px solid var(--border); }
    .tab { padding: 0.5rem 1rem; font-size: 0.9rem; color: var(--muted); text-decoration: none; border-bottom: 2px solid transparent; margin-bottom: -1px; display: inline-flex; align-items: center; gap: 0.35rem; }
    .tab:hover { color: var(--text); }
    .tab.active { color: var(--accent); border-bottom-color: var(--accent); }
    .tab-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); }
    .card { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 1.5rem; margin-bottom: 1rem; }
    .card h2 { font-size: 0.75rem; font-weight: 500; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); margin-bottom: 0.75rem; }
    .dropzone { border: 2px dashed var(--border); border-radius: 8px; padding: 2rem; text-align: center; cursor: pointer; transition: border-color 0.15s, background 0.15s; }
    .dropzone:hover, .dropzone.dragover { border-color: var(--accent-dim); background: rgba(196, 165, 116, 0.05); }
    .dropzone p { color: var(--muted); font-size: 0.9rem; }
    input[type="file"] { display: none; }
    .btn { background: var(--accent); color: var(--bg); border: none; border-radius: 6px; padding: 0.6rem 1rem; font-size: 0.9rem; font-weight: 500; cursor: pointer; font-family: inherit; margin-top: 0.75rem; }
    .btn:hover { opacity: 0.9; }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .results { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 1rem; margin-top: 1rem; }
    .result-item { display: block; background: var(--bg); border: 1px solid var(--border); border-radius: 6px; overflow: hidden; color: inherit; text-decoration: none; transition: border-color 0.15s; }
    a.result-item:hover { border-color: var(--accent-dim); }
    .result-item img { width: 100%; aspect-ratio: 1; object-fit: cover; display: block; }
    .result-item .cap { padding: 0.4rem 0.5rem; font-size: 0.75rem; color: var(--muted); }
    .result-item .cap strong { color: var(--accent); }
    .empty-msg { color: var(--muted); padding: 1rem 0; }
    .breakdown { font-size: 0.85rem; color: var(--muted); margin-bottom: 0.25rem; }
    .breakdown strong { color: var(--text); font-weight: 500; }
    .preview { max-width: 160px; max-height: 160px; border-radius: 6px; border: 1px solid var(--border); margin-top: 0.5rem; }
  </style>
</head>
<body>
  <div class="container">
    <nav class="tabs">
      <a href="/" class="tab">Ingestion</a>
      <a href="/analyses" class="tab">Analyses</a>
      <a href="/your-taste" class="tab" id="tabYourTaste">Your Taste</a>
      <a href="/find-similar" class="tab active">Find similar</a>
    </nav>
    <h1>TasteMaker</h1>

    <div class="card">
      <h2>Find similar images</h2>
      <p style="color:var(--muted);font-size:0.9rem;margin-bottom:0.75rem;">Upload an image to find visually similar images in your archive.</p>
      <div class="dropzone" id="dropzone">
        <p>Drop an image, paste (Ctrl+V), or click to choose</p>
      </div>
      <input type="file" id="fileInput" accept="image/*">
      <div id="previewWrap"></div>
      <button class="btn" id="btnFind" disabled>Find similar</button>
    </div>

    <div id="resultsWrap"></div>
  </div>

  <script>
    var selectedFile = null;

    document.getElementById('dropzone').onclick = function() { document.getElementById('fileInput').click(); };
    document.getElementById('dropzone').ondragover = function(e) { e.preventDefault(); e.currentTarget.classList.add('dragover'); };
    document.getElementById('dropzone').ondragleave = function(e) { e.currentTarget.classList.remove('dragover'); };
    document.getElementById('dropzone').ondrop = function(e) {
      e.preventDefault();
      e.currentTarget.classList.remove('dragover');
      var f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
      if (f && f.type.startsWith('image/')) setFile(f);
    };
    document.getElementById('fileInput').onchange = function(e) {
      var f = e.target.files && e.target.files[0];
      if (f) setFile(f);
      e.target.value = '';
    };

    document.addEventListener('paste', function(e) {
      var items = (e.clipboardData && e.clipboardData.items) || [];
      for (var i = 0; i < items.length; i++) {
        if (items[i].type.startsWith('image/')) {
          var f = items[i].getAsFile();
          if (f) { e.preventDefault(); setFile(f); }
          return;
        }
      }
    });

    var previewUrl = null;
    function setFile(file) {
      selectedFile = file;
      document.getElementById('btnFind').disabled = false;
      var wrap = document.getElementById('previewWrap');
      wrap.innerHTML = '';
      if (previewUrl) URL.revokeObjectURL(previewUrl);
      previewUrl = URL.createObjectURL(file);
      var img = document.createElement('img');
      img.className = 'preview';
      img.src = previewUrl;
      wrap.appendChild(img);
      runSearch();
    }

    function escapeHtml(s) {
      if (s == null) return '';
      var div = document.createElement('div');
      div.textContent = s;
      return div.innerHTML;
    }

    // External CDNs (e.g. Pinterest) sometimes block hotlinking: retry once through the proxy, then show a blank tile
    function onThumbError(img) {
      var src = img.getAttribute('data-src') || '';
      if (!img.dataset.proxied && /^https?:\/\//.test(src)) {
        img.dataset.proxied = '1';
        img.src = '/api/proxy-image?url=' + encodeURIComponent(src);
      } else {
        img.onerror = null;
        img.removeAttribute('src');
        img.style.background = 'var(--border)';
      }
    }

    function collectionBreakdown(matches) {
      var counts = {};
      matches.forEach(function(m) {
        var k = m.source_collection || 'Untitled';
        counts[k] = (counts[k] || 0) + 1;
      });
      var top = Object.keys(counts).sort(function(a, b) { return counts[b] - counts[a]; }).slice(0, 3);
      return 'Mostly from ' + top.map(function(k) {
        return '<strong>' + escapeHtml(k) + '</strong> (' + counts[k] + ')';
      }).join(', ');
    }

    document.getElementById('btnFind').onclick = runSearch;

    async function runSearch() {
      if (!selectedFile) return;
      var btn = document.getElementById('btnFind');
      var wrap = document.getElementById('resultsWrap');
      btn.disabled = true;
      btn.textContent = 'Searching…';
      wrap.innerHTML = '<p class="empty-msg">Loading…</p>';
      try {
        var form = new FormData();
        form.append('file', selectedFile);
        var res = await fetch('/api/find-similar?limit=12', { method: 'POST', body: form });
        if (!res.ok) {
          var err = await res.json().catch(function() { return {}; });
          throw new Error(err.detail || err.message || res.statusText);
        }
        var data = await res.json();
        var matches = data.matches || [];
        if (matches.length === 0) {
          wrap.innerHTML = '<div class="card"><p class="empty-msg">No similar images in your archive. Ingest some sources first.</p></div>';
        } else {
          var html = '<div class="card"><h2>Similar images</h2><p class="breakdown">' + collectionBreakdown(matches) + '</p><div class="results">';
          matches.forEach(function(m) {
            var url = escapeHtml(m.display_url || m.image_url || '');
            var coll = escapeHtml(m.source_collection || '');
            var sim = m.similarity != null ? m.similarity + '%' : '';
            var src = /^https?:\/\//.test(m.source_url || '') ? m.source_url : '';
            html += src
              ? '<a class="result-item" href="' + escapeHtml(src) + '" target="_blank" rel="noopener" title="Open source">'
              : '<div class="result-item">';
            html += '<img src="' + url + '" data-src="' + url + '" alt="" loading="lazy" onerror="onThumbError(this)">';
            html += '<div class="cap"><strong>' + coll + '</strong>' + (sim ? ' · ' + sim + ' match' : '') + '</div>';
            html += src ? '</a>' : '</div>';
          });
          html += '</div></div>';
          wrap.innerHTML = html;
        }
      } catch (e) {
        wrap.innerHTML = '<div class="card"><p class="empty-msg" style="color:#c45c5c">' + escapeHtml(e.message || String(e)) + '</p></div>';
      }
      btn.disabled = false;
      btn.textContent = 'Find similar';
    }

    fetch('/api/taste/status').then(function(r) { return r.json(); }).then(function(d) {
      if (d.needs_reanalysis) {
        var t = document.getElementById('tabYourTaste');
        if (t && !t.querySelector('.tab-dot')) {
          var dot = document.createElement('span');
          dot.className = 'tab-dot';
          dot.title = 'New ingestions — re-analyze your taste';
          t.appendChild(dot);
        }
      }
    }).catch(function() {});
  </script>
</body>
</html>
