<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TasteMaker · Analyses</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,400&family=DM+Serif+Display&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0f0f0e;
      --surface: #1a1a18;
      --border: #2a2a26;
      --text: #e8e6e3;
      --muted: #8a8784;
      --accent: #c4a574;
      --accent-dim: #8b7355;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'DM Sans', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      line-height: 1.5;
    }
    .container {
      max-width: 720px;
      margin: 0 auto;
      padding: 3rem 1.5rem;
    }
    h1 {
      font-family: 'DM Serif Display', serif;
      font-size: 1.75rem;
      font-weight: 400;
      color: var(--accent);
      margin-bottom: 1.5rem;
    }
    .tabs { display: flex; gap: 0; margin-bottom: 1.5rem; border-bottom: 1px solid var(--border); }
    .tab { padding: 0.5rem 1rem; font-size: 0.9rem; color: var(--muted); text-decoration: none; border-bottom: 2px solid transparent; margin-bottom: -1px; }
    .tab:hover { color: var(--text); }
    .tab.active { color: var(--accent); border-bottom-color: var(--accent); }
    .tab { display: inline-flex; align-items: center; gap: 0.35rem; }
    .tab-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); }
    .collection {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 1.5rem;
      margin-bottom: 1.5rem;
    }
    .collection-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
      margin-bottom: 1.25rem;
      padding-bottom: 0.75rem;
      border-bottom: 1px solid var(--border);
    }
    .collection-header-left { display: flex; align-items: baseline; gap: 0.75rem; flex: 1; min-width: 0; }
    .collection-name {
      font-family: 'DM Serif Display', serif;
      font-size: 1.25rem;
      color: var(--text);
      cursor: text;
      border-radius: 4px;
      padding: 0.15rem 0.25rem;
      margin: -0.15rem -0.25rem;
    }
    .collection-name:hover { background: rgba(255,255,255,0.05); }
    .collection-name-edit {
      font-family: inherit;
      font-size: 1.25rem;
      width: 100%;
      max-width: 320px;
      background: var(--bg);
      border: 1px solid var(--accent-dim);
      color: var(--text);
      padding: 0.25rem 0.5rem;
      border-radius: 4px;
    }
    .collection-meta {
      font-size: 0.8rem;
      color: var(--muted);
    }
    .collection-actions { display: flex; align-items: center; gap: 0.5rem; }
    .collection-actions button {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--muted);
      padding: 0.35rem 0.6rem;
      font-size: 0.75rem;
      border-radius: 4px;
      cursor: pointer;
      font-family: inherit;
    }
    .collection-actions button:hover { color: var(--text); border-color: var(--muted); }
    .collection-actions button.delete:hover { border-color: #c45c5c; color: #c45c5c; }
    .collection-thumbs {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      margin-bottom: 1rem;
    }
    .collection-thumbs img {
      width: 72px;
      height: 72px;
      object-fit: cover;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: var(--bg);
    }
    .collection-source {
      font-size: 0.85rem;
      margin-bottom: 1rem;
    }
    .collection-source a {
      color: var(--accent);
      text-decoration: none;
    }
    .collection-source a:hover { text-decoration: underline; }
    .analysis-section {
      margin-bottom: 1rem;
    }
    .analysis-section:last-child { margin-bottom: 0; }
    .analysis-section h3 {
      font-size: 0.7rem;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--muted);
      margin-bottom: 0.4rem;
    }
    .color-swatches {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.5rem;
      margin-bottom: 0.5rem;
    }
    .color-swatch {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      border: 1px solid var(--border);
      flex-shrink: 0;
    }
    .analysis-section .list {
      display: flex;
      flex-wrap: wrap;
      gap: 0.35rem;
    }
    .analysis-section .tag {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 0.25rem 0.5rem;
      font-size: 0.85rem;
      color: var(--text);
    }
    .analysis-section .mood {
      font-size: 0.95rem;
      color: var(--text);
      line-height: 1.5;
    }
    .analysis-section .directions {
      list-style: none;
    }
    .analysis-section .directions li {
      padding: 0.35rem 0;
      padding-left: 1rem;
      border-left: 2px solid var(--accent-dim);
      margin-bottom: 0.5rem;
      font-size: 0.9rem;
      color: var(--text);
    }
    .empty {
      text-align: center;
      color: var(--muted);
      padding: 3rem 1.5rem;
    }
    .empty a { color: var(--accent); text-decoration: none; }
    .empty a:hover { text-decoration: underline; }
    .loading { color: var(--muted); text-align: center; padding: 2rem; }
    .skeleton { background: linear-gradient(90deg, var(--border) 25%, var(--surface) 50%, var(--border) 75%); background-size: 200% 100%; animation: skeleton 1.2s ease-in-out infinite; border-radius: 6px; }
    @keyframes skeleton { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
    .skeleton-summary { height: 56px; margin-bottom: 1.5rem; }
    .skeleton-card { height: 180px; margin-bottom: 1.5rem; }
    .summary {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 1rem 1.25rem;
      margin-bottom: 1.5rem;
      font-size: 0.9rem;
      color: var(--muted);
    }
    .summary strong { color: var(--text); }
  </style>
</head>
<body>
  <div class="container">
    <nav class="tabs" id="tabs">
      <a href="/" class="tab">Ingestion</a>
      <a href="/analyses" class="tab active">Analyses</a>
      <a href="/your-taste" class="tab" id="tabYourTaste">Your Taste</a>
      <a href="/find-similar" class="tab">Find similar</a>
      <a href="/constellation" class="tab">Constellation</a>
    </nav>
    <h1>TasteMaker</h1>

    <div id="content">
      <div class="skeleton skeleton-summary"></div>
      <div class="skeleton skeleton-card"></div>
      <div class="skeleton skeleton-card"></div>
      <div class="skeleton skeleton-card"></div>
    </div>
  </div>

  <script>
    var colorNameToHex = {
      pink: '#ff69b4', 'hot pink': '#ff69b4', magenta: '#ff00ff', coral: '#ff7f50', peach: '#ffcba4',
      cyan: '#00ffff', blue: '#4169e1', 'electric blue': '#7df9ff', 'navy': '#000080', indigo: '#4b0082',
      purple: '#9b59b6', violet: '#ee82ee', lavender: '#e6e6fa', 'vaporwave purple': '#9b59b6',
      green: '#2ecc71', 'neon green': '#39ff14', lime: '#32cd32', mint: '#98ff98', sage: '#9dc183',
      yellow: '#ffd700', 'acid yellow': '#e8e608', gold: '#ffd700', ochre: '#cc7722',
      orange: '#ff8c00', 'sunset orange': '#fd5e53', terracotta: '#e2725b',
      red: '#e74c3c', white: '#f5f5f5', black: '#1a1a1a', gray: '#808080', grey: '#808080', silver: '#c0c0c0',
      chrome: '#c0c0c0', neutral: '#8a8a8a', beige: '#f5f5dc', linen: '#faf0e6', cream: '#fffdd0',
      brown: '#8b4513', earth: '#8b7355'
    };
    function paletteToHex(str) {
      if (!str || typeof str !== 'string') return null;
      var s = str.toLowerCase().trim();
      if (/^#[0-9a-f]{3,8}$/i.test(s)) return s;
      for (var key in colorNameToHex) {
        if (s.indexOf(key) !== -1) return colorNameToHex[key];
      }
      if (s.indexOf(' and ') !== -1) {
        var parts = s.split(' and ');
        for (var i = 0; i < parts.length; i++) {
          var hex = paletteToHex(parts[i].trim());
          if (hex) return hex;
        }
      }
      return null;
    }

    async function load() {
      const el = document.getElementById('content');
      try {
        const res = await fetch('/api/collections');
        if (!res.ok) throw new Error(res.statusText);
        const collections = await res.json();
        if (!collections.length) {
          el.innerHTML = `
            <div class="empty">
              <p>No analyses yet.</p>
              <p style="margin-top: 0.5rem;"><a href="/">Add sources and run ingestion</a> to generate collection analyses.</p>
            </div>`;
          return;
        }
        const totalImages = collections.reduce((sum, c) => sum + (c.total_images || 0), 0);
        const summary = '<div class="summary"><strong>' + collections.length + ' collection' + (collections.length !== 1 ? 's' : '') + '</strong> from all ingestions · <strong>' + totalImages + ' image' + (totalImages !== 1 ? 's' : '') + '</strong> total. Each card below is one ingested source (Pinterest board, Cosmos cluster, or screenshot).</div>';
        el.innerHTML = summary + collections.map(c => renderCollection(c)).join('');
      } catch (e) {
        el.innerHTML = `<div class="empty"><p>Could not load collections: ${e.message}</p></div>`;
      }
    }

    function renderCollection(c) {
      const meta = [c.source_platform, c.total_images + ' image' + (c.total_images !== 1 ? 's' : '')].filter(Boolean).join(' · ');
      const arr = (v) => Array.isArray(v) ? v : [];
      const material = arr(c.material_vocabulary);
      const spatial = arr(c.spatial_qualities);
      const forms = arr(c.recurring_forms);
      const palette = arr(c.color_palette);
      const directions = arr(c.installation_directions);
      const mood = c.mood_atmosphere || '';
      const sampleUrls = arr(c.sample_image_urls);
      const sourceUrl = c.source_url || '';

      let thumbs = '';
      if (sampleUrls.length) {
        thumbs = '<div class="collection-thumbs">';
        sampleUrls.forEach(url => {
          thumbs += '<img src="' + escapeAttr(url) + '" alt="" loading="lazy">';
        });
        thumbs += '</div>';
      }
      let sourceLink = '';
      if (sourceUrl) {
        sourceLink = '<p class="collection-source">Source: <a href="' + escapeAttr(sourceUrl) + '" target="_blank" rel="noopener">' + escapeHtml(sourceUrl) + '</a></p>';
      }

      let sections = '';
      if (material.length) sections += section('Material vocabulary', material);
      if (spatial.length) sections += section('Spatial qualities', spatial);
      if (forms.length) sections += section('Recurring forms', forms);
      if (palette.length) {
        var swatchHtml = '<div class="color-swatches">';
        palette.forEach(function(p) {
          var hex = paletteToHex(p);
          swatchHtml += '<span class="color-swatch" style="background:' + (hex || 'var(--border)') + '" title="' + escapeAttr(p) + '"></span>';
        });
        swatchHtml += '</div>';
        sections += '<div class="analysis-section"><h3>Color palette</h3>' + swatchHtml + '<div class="list">' + palette.map(function(p) { return '<span class="tag">' + escapeHtml(String(p)) + '</span>'; }).join('') + '</div></div>';
      }
      if (mood) sections += `<div class="analysis-section"><h3>Mood & atmosphere</h3><p class="mood">${escapeHtml(mood)}</p></div>`;
      if (directions.length) {
        sections += '<div class="analysis-section"><h3>Installation directions</h3><ul class="directions">';
        directions.forEach(d => { sections += `<li>${escapeHtml(String(d))}</li>`; });
        sections += '</ul></div>';
      }

      const id = (c.id != null ? c.id : '').toString();
      const name = (c.collection_name != null ? c.collection_name : '').toString();
      return `
        <div class="collection" data-collection-id="${escapeAttr(id)}">
          <div class="collection-header">
            <div class="collection-header-left">
              <span class="collection-name" data-collection-id="${escapeAttr(id)}" data-collection-name="${escapeAttr(name)}" title="Click to edit">${escapeHtml(name)}</span>
              <span class="collection-meta">${escapeHtml(meta)}</span>
            </div>
            <div class="collection-actions">
              <button type="button" class="delete" data-collection-id="${escapeAttr(id)}">Delete</button>
            </div>
          </div>
          ${thumbs}
          ${sourceLink}
          ${sections || '<p class="mood" style="color:var(--muted)">No analysis fields yet.</p>'}
        </div>`;
    }

    function escapeAttr(s) {
      if (s == null) return '';
      return String(s)
        .replace(/&/g, '&amp;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;');
    }

    function section(title, items) {
      const tags = items.map(i => `<span class="tag">${escapeHtml(String(i))}</span>`).join('');
      return `<div class="analysis-section"><h3>${escapeHtml(title)}</h3><div class="list">${tags}</div></div>`;
    }

    function escapeHtml(s) {
      const div = document.createElement('div');
      div.textContent = s;
      return div.innerHTML;
    }

    document.getElementById('content').addEventListener('click', async (e) => {
      const card = e.target.closest('.collection');
      const id = card && card.dataset.collectionId;

      if (e.target.classList.contains('delete') && id) {
        if (!confirm('Delete this collection and all its images? This cannot be undone.')) return;
        try {
          const res = await fetch('/api/collections/' + encodeURIComponent(id), { method: 'DELETE' });
          if (!res.ok) throw new Error(res.statusText);
          card.remove();
        } catch (err) {
          alert(err.message || 'Delete failed');
        }
        return;
      }

      if (e.target.classList.contains('collection-name') && id && !e.target.querySelector('input')) {
        const span = e.target;
        const current = span.dataset.collectionName || span.textContent || '';
        const input = document.createElement('input');
        input.type = 'text';
        input.className = 'collection-name-edit';
        input.value = current;
        input.dataset.collectionId = id;
        span.replaceWith(input);
        input.focus();
        input.select();

        function save() {
          const newName = input.value.trim();
          const parent = input.parentNode;
          const next = input.nextSibling;
          input.remove();
          const newSpan = document.createElement('span');
          newSpan.className = 'collection-name';
          newSpan.dataset.collectionId = id;
          newSpan.dataset.collectionName = newName || current;
          newSpan.title = 'Click to edit';
          newSpan.textContent = newName || current;
          parent.insertBefore(newSpan, next);
          if (newName && newName !== current) {
            fetch('/api/collections/' + encodeURIComponent(id), {
              method: 'PATCH',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ collection_name: newName }),
            }).then(r => { if (!r.ok) throw new Error('Save failed'); }).catch(() => { newSpan.textContent = current; newSpan.dataset.collectionName = current; });
          }
        }

        input.addEventListener('blur', save, { once: true });
        input.addEventListener('keydown', (ev) => { if (ev.key === 'Enter') { ev.preventDefault(); input.blur(); } });
      }
    });

    load();
    fetch('/api/taste/status').then(r => r.json()).then(d => {
      if (d.needs_reanalysis) {
        const t = document.getElementById('tabYourTaste');
        if (t && !t.querySelector('.tab-dot')) { const dot = document.createElement('span'); dot.className = 'tab-dot'; dot.title = 'New ingestions — re-analyze your taste'; t.appendChild(dot); }
      }
    }).catch(() => {});
  </script>
</body>
</html>
